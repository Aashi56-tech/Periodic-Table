<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Periodic Table</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧪 Interactive Periodic Table</h1>
        <p>Explore all 118 chemical elements</p>

        <input
            type="text"
            id="search"
            placeholder="🔎 Search an element..."
        >

        <button id="darkMode">
            🌙 Dark Mode
        </button>
    </header>

    <main>

        <div id="periodic-table"></div>

        <section id="info-box">
            <h2>Select an Element</h2>
            <p>
                Click on any element to see its information.
            </p>
        </section>

    </main>

    <footer>
        <p>Made with HTML, CSS & JavaScript 🚀</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
